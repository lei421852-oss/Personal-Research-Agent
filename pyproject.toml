[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
retrieval = ["chromadb>=1.0,<2.0", "torch>=2.5,<3.0", "transformers>=4.51,<5.0"]
vision = ["openai>=1.0,<3.0"]
llm = ["openai>=1.0,<3.0", "python-dotenv>=1.0,<2.0"]
data = ["PyMuPDF>=1.24,<2.0"]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "python-dotenv>=1.0,<2.0"]
ui-test = ["playwright>=1.50,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]
